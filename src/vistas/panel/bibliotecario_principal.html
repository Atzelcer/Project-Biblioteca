<div class="buscador">
    <input id="buscaLibros" type="text" placeholder="Buscar..." />

</div>

<h2>Colecciones</h2>

<div class="libros">
    {{libros}}
</div>

<div id="modalBibliotecario" class="modal" style="display:none;">

        </div>

    </div>

</div>
