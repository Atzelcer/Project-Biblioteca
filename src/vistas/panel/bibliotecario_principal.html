
<div style="width:100%;display:flex;justify-content:flex-end;align-items:center;margin-bottom:8px;position:relative;top:-8px;">
    <button id="btnThemeToggle" style="padding:8px 18px;border-radius:12px;background:var(--gradRB);color:#fff;font-weight:600;border:none;box-shadow:0 2px 8px rgba(0,0,0,.12);cursor:pointer;transition:background .3s,filter .2s;">Modo claro</button>
</div>

<div class="buscador" style="margin-top:0;display:flex;align-items:center;justify-content:center;gap:10px;">
    <input id="buscaLibros" type="text" placeholder="Buscar..." />
    <button id="btnBuscaLibros">Buscar</button>
</div>

<h2>Colecciones</h2>

<div class="libros">
    {{libros}}
</div>
<!-- Modal para ingresar CI -->
<div id="modalCI" style="display:none;">
    <div class="modal-bg"></div>
    <div class="modal-content modal-modern">
                <h3 class="modal-title" id="modalTitleCI">Ingresar CI del usuario</h3>
                <div id="modalCIForm">
                    <input id="inputCI" class="modal-input" type="text" placeholder="Carnet de Identidad">
                    <div class="modal-actions">
                            <button id="btnBuscarCI" class="btn modal-btn confirm">Buscar</button>
                            <button id="btnCancelarCI" class="btn modal-btn cancel">Cancelar</button>
                    </div>
                </div>
                <div id="modalCIResultado" style="display:none;"></div>
    </div>
</div>
<script src="{{base}}/public/js/bibliotecario_principal.js"></script>
