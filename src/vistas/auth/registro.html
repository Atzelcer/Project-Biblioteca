<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Crear cuenta</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="{{base}}/public/css/auth.css">
  <script defer src="{{base}}/public/js/registro.js"></script>
</head>
<body class="page-center">
  <div class="card">
    <h2>Crear cuenta</h2>

    <div class="msg_err">{{mensaje_error}}</div>

    <form method="post" action="{{base}}/src/entradas/registro.php" enctype="multipart/form-data" autocomplete="off" class="form">
      <div class="row">
        <div class="column">
          <div>
            <label>Nombre</label>
            <br>
            <input name="nombre" autocomplete="off" required>
          </div>
          <div>
            <label>CI</label>
            <br>
            <input name="ci" autocomplete="off" required>
          </div>
          
          <div>
            <label>Dirección</label>
            <br>
            <input name="direccion" autocomplete="off">
          </div>

          <div>
            <label>Celular</label>
            <br>
            <input name="celular" autocomplete="off">
          </div>

        </div>

        <div class="column">
          <div>
            <label>Apellido</label>
            <br>
            <input name="apellido" autocomplete="off" required>
          </div>
          <div>
            <label>Contraseña</label>
            <br>
            <input name="pwd" type="password" autocomplete="new-password" required>
          </div>


          
          <div>
            <label>Correo</label>
            <br>
            <input name="correo" type="email" autocomplete="off" required>
          </div>
          <div>
            <label>Subir Imagen</label>
            <label for="foto" class="file-label">Foto de perfil</label>
            <input id="foto" name="foto" type="file" accept="image/*" hidden>
          </div>
        </div>
      </div>
      <div class="full">
        <button type="submit">Registrar</button>
      </div>
    </form>

    <div class="alt">
      ¿Ya tienes cuenta? <a href="{{base}}/src/entradas/login.php">Iniciar sesión</a>
    </div>
  </div>
</body>
</html>
