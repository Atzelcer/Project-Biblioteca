<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Crear cuenta</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="{{base}}/public/css/auth.css">
  <script defer src="{{base}}/public/js/registro.js"></script>
</head>
<body class="page-center">
  <div class="grid">
    <h2>Crear cuenta</h2>

    <div class="msg err">{{mensaje_error}}</div>

    <form method="post" action="{{base}}/src/entradas/registro.php" enctype="multipart/form-data" autocomplete="off">
      <div class="row">
        <div>
          <label>Nombre</label>
          <input name="nombre" required>
        </div>
        <div>
          <label>Contraseña</label>
          <input name="pwd" type="password" required>
        </div>

        <div>
          <label>Apellido</label>
          <input name="apellido" required>
        </div>
        <div>
          <label>Dirección</label>
          <input name="direccion">
        </div>

        <div>
          <label>CI</label>
          <input name="ci" required>
        </div>
        <div>
          <label>Foto de perfil</label>
          <input name="foto" type="file" accept="image/*">
        </div>

        <div>
          <label>Celular</label>
          <input name="celular">
        </div>
        <div>
          <label>Correo</label>
          <input name="correo" type="email" required>
        </div>

        <div class="full">
          <button type="submit">Registrar</button>
        </div>
      </div>
    </form>

    <div class="alt">
      ¿Ya tienes cuenta? <a href="{{base}}/src/entradas/login.php">Iniciar sesión</a>
    </div>
  </div>
</body>
</html>
